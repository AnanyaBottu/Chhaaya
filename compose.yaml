services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chhaaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chhaaya
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chhaaya"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chhaaya:${POSTGRES_PASSWORD}@db:5432/chhaaya
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "chhaaya.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chhaaya:${POSTGRES_PASSWORD}@db:5432/chhaaya
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
